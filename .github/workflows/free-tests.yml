name: Free Tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: downstream-free-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  free-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GIT_AUTHOR_NAME: Downstream CI Fixture
      GIT_AUTHOR_EMAIL: downstream-ci@example.test
      GIT_COMMITTER_NAME: Downstream CI Fixture
      GIT_COMMITTER_EMAIL: downstream-ci@example.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify downstream rendering, installation boundaries and updater
        run: >-
          bun test
          test/module-size-ratchet.test.ts
          test/skill-check-host-selection.test.ts
          test/question-tuning-registry-path.test.ts
          test/shared-libs-rendering.test.ts
          test/setup-codex-host-boundaries.test.ts
          test/codex-gbrain-binding.test.ts
          test/codex-request-file.test.ts
          test/codex-native-lifecycle.test.ts
          test/gstack-codex-session-import.test.ts
          test/spawnsync-timeout-tripwire.test.ts
          test/gate-secret-scan.test.ts
          test/codex-fork-paid-boundary.test.ts
          test/bun-resolve.test.ts
          test/session-update-autostash.test.ts
