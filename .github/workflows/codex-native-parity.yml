name: Codex native parity
on:
  push:
    branches: [main, codex/native-parity-latest]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codex-native-parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Check product and test types without widening baselines
        run: |
          bun run typecheck
          bun run typecheck:test
      - name: Preflight native portability and fork CI contracts
        run: bun test test/module-size-ratchet.test.ts test/skill-check-host-selection.test.ts test/question-tuning-registry-path.test.ts test/shared-libs-rendering.test.ts test/free-tests-workflow-wiring.test.ts test/setup-codex-host-boundaries.test.ts
      - name: Verify native Codex parity against pinned upstream
        run: bun test test/codex-native-parity.test.ts test/codex-native-source-parity.test.ts test/codex-native-complete-output.test.ts test/codex-section-loading.test.ts
      - name: Generate every host without installing
        run: bun run gen:skill-docs --host all --out-dir "$RUNNER_TEMP/gstack-render"
      - name: Check native lifecycle and bounded test processes
        run: bun test test/codex-gbrain-binding.test.ts test/codex-request-file.test.ts test/codex-native-lifecycle.test.ts test/gstack-codex-session-import.test.ts test/spawnsync-timeout-tripwire.test.ts
